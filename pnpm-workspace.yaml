packages:
  - 'apps/*'
  - 'packages/*'

# Packages allowed to run install scripts. Everything else is blocked by default —
# a postinstall script is arbitrary code execution inside a repo that will hold
# financial data (spec §47). Each entry below is a build toolchain that compiles
# a native binary and genuinely needs one.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': true
  '@swc/core': true

minimumReleaseAgeExclude:
  - tsx@4.23.9
  - '@supabase/auth-js@2.112.2'
  - '@supabase/functions-js@2.112.2'
  - '@supabase/postgrest-js@2.112.2'
  - '@supabase/realtime-js@2.112.2'
  - '@supabase/storage-js@2.112.2'
  - '@supabase/supabase-js@2.112.2'

# The advisory is against esbuild's development server, reachable only while a
# build tool is running locally. It arrives transitively through drizzle-kit's
# deprecated `@esbuild-kit/*` chain, which will not be patched upstream. Forcing
# a fixed esbuild is the whole fix; `pnpm audit` is part of the gate, so this
# would otherwise fail the build on a finding nobody can act on.
overrides:
  esbuild: '>=0.25.0'
